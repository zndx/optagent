[project]
name = "optagent"
version = "0.1.0"
description = "Cloudera AMP project template. Devenv runs it locally. Cloudera Machine Learning launches the numbered jobs and application."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "zndx" }]
keywords = ["cloudera", "amp", "cml", "template", "devenv"]
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.71",
  "grpcio-reflection>=1.71",
  "protobuf>=6.31.1",
  "psycopg[binary]>=3.2",
  "pyhocon>=0.3.61",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = [
  "holoviews>=1.20",
  "datashader>=0.17",
  "bokeh>=3.6",
  "panel>=1.5",
  "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
