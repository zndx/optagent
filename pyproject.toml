[project]
name = "optagent"
version = "0.1.0"
description = "Cloudera AMP project template. Devenv runs it locally. Cloudera Machine Learning launches the numbered jobs and application."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "zndx" }]
keywords = ["cloudera", "amp", "cml", "template", "devenv"]
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyhocon>=0.3.61",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
