#
# Cloudera Machine Learning runbook. The install step is a job: PBJ
# runtimes fail AMP setup steps that run as sessions. Jobs stay in the
# project and can be run again from the Jobs tab.
#
# Local development does not use this file. Use devenv (devenv.nix).

name: Optagent
description: >
  Project template for a Cloudera Machine Learning AMP. PostgreSQL 16
  loads impala_fdw so SQL can read Kudu and Iceberg in place. Devenv
  runs the same jobs locally.
author: zndx
specification_version: "1.0"
prototype_version: "0.1.0"
date: "2026-10-15"

environment_variables:
  OPTAGENT_POSTURE:
    default: "amp"
    description: "amp talks to Impala HS2 only. A local devenv shell leaves this unset and stays on the FDW."
    required: false
  IMPALA_AUTH:
    default: "kerberos"
    description: "Auth for the direct Impala posture. kerberos is the only accepted value."
    required: false
  IMPALA_DATABASE:
    default: "optagent"
    description: "Impala database for the span ledger when posture is amp."
    required: false
  OPTAGENT_CDE_ENABLED:
    default: "false"
    description: "Record that Cloudera Data Engineering will join this AMP later. Does not start Spark."
    required: false
  OPTAGENT_GREETING:
    default: "Hello from the Optagent AMP template."
    description: "Greeting the prepare job records and the application shows."
    required: false
  OPTAGENT_STATUS_PATH:
    default: "assets/data/status.json"
    description: "Project-relative path where the prepare job writes the status snapshot."
    required: false
  OPTAGENT_DB_URL:
    default: "postgres://127.0.0.1:5466/optagent"
    description: "PostgreSQL that loads impala_fdw. Devenv listens on port 5466."
    required: false
  IMPALA_HS2_HOST:
    default: ""
    description: "Impala HS2 host. Empty skips CREATE SERVER. Product auth is Kerberos."
    required: false
  IMPALA_HS2_PORT:
    default: "21050"
    description: "Impala HS2 port."
    required: false
  KUDU_MASTERS:
    default: ""
    description: "Kudu master list. Empty uses IMPALA_HS2_HOST:7051 when a server is created."
    required: false
  IMPALA_KRB_PRINCIPAL:
    default: ""
    description: "Kerberos principal for the FDW user mapping. Empty skips the mapping."
    required: false
  IMPALA_KRB_KEYTAB:
    default: ""
    description: "Keytab path for the FDW user mapping."
    required: false
  IMPALA_FDW_AUTH:
    default: "kerberos"
    description: "FDW auth. The only accepted value is kerberos."
    required: false

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Standard
  - editor: PBJ Workbench
    kernel: Python 3.13
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.12
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_dependencies
    script: 0_session-install-dependencies/install-dependencies.py
    arguments: ""
    kernel: python3
    cpu: 1
    memory: 2
    short_summary: Create the job that installs requirements.txt.
    environment_variables:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_dependencies
    short_summary: Install runtime dependencies from requirements.txt.

  - type: create_job
    name: Register Impala FDW
    entity_label: register_impala_fdw
    script: scripts/warehouse/register_impala_fdw.py
    arguments: ""
    kernel: python3
    cpu: 1
    memory: 4
    short_summary: Create the job that registers impala_fdw. The amp posture skips it.
    environment_variables:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: register_impala_fdw
    short_summary: Build impala_fdw when the toolchain is present and register it.

  - type: create_job
    name: Prepare project
    entity_label: prepare_project
    script: 1_job-prepare-project/job.py
    arguments: ""
    kernel: python3
    cpu: 1
    memory: 2
    short_summary: Create the job that writes the status snapshot.
    environment_variables:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: prepare_project
    short_summary: Write the status snapshot to OPTAGENT_STATUS_PATH.

  - type: start_application
    name: Optagent
    subdomain: optagent
    script: 2_app-serve/app.py
    kernel: python3
    cpu: 1
    memory: 2
    short_summary: Serve the status snapshot.
    long_summary: >
      Shows the greeting and the snapshot written by the prepare job.
    environment_variables:
      TASK_TYPE: START_APPLICATION
