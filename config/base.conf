# Optagent configuration.
#
# HOCON is the source for deployment posture. Environment overrides use
# ${?VAR}. A missing variable leaves the default in place when the loader
# falls back, and an explicit variable replaces it.
#
# posture = local  — devenv. Postgres and impala_fdw. No Impala client.
# posture = amp    — workbench. Impala HS2 directly. No FDW, no local Postgres.
#
# The AMP baseline that fills the amp values is SOPS ciphertext
# .env.cai.enc. scripts/bootstrap-secrets.sh decrypts it when
# SOPS_AGE_KEY or SOPS_AGE_KEY_FILE is set. The local shell does not
# run that script.

posture = local
posture = ${?OPTAGENT_POSTURE}

# Logo pack. The product name stays OptAgent. Theme stays Keiretsu.
# A settings choice writes .devenv/state/optagent-ui.json and wins over this.
ui {
  brand_id = weathership
  brand_id = ${?OPTAGENT_BRAND_ID}
}

fdw {
  database_url = "postgres://127.0.0.1:5599/optagent"
  database_url = ${?OPTAGENT_DB_URL}
}

impala {
  host = ""
  host = ${?IMPALA_HS2_HOST}
  port = 21050
  port = ${?IMPALA_HS2_PORT}
  database = optagent
  database = ${?IMPALA_DATABASE}
  auth = kerberos
  auth = ${?IMPALA_AUTH}
  principal = ""
  principal = ${?IMPALA_KRB_PRINCIPAL}
  keytab = ""
  keytab = ${?IMPALA_KRB_KEYTAB}
}

# Cloudera Data Engineering joins this posture later. The flag records
# the intent. This tree does not import Spark.
cde {
  enabled = false
  enabled = ${?OPTAGENT_CDE_ENABLED}
}

# One prefix for both directions. The local shell publishes agent session
# objects here. The AMP lists that same prefix and analyzes what it finds.
# Layout matches agentsview: s3://<bucket>/.../<machine>/raw/<agent>/...
# This is not the sample workspace. Sample mode uses snapshot.s3_uri.
traces {
  s3_uri = ""
  s3_uri = ${?OPTAGENT_TRACES_S3_URI}
}

# signals-snapshot pointer. Locally the endpoint is Signals' RustFS.
# This project does not run an object store. In the AMP the endpoint
# stays empty and the URI is an AWS S3 location of the same document.
snapshot {
  sample_mode = false
  sample_mode = ${?OPTAGENT_SAMPLE_MODE}
  s3_uri = "s3://signals-snapshots/sample/workspace"
  s3_uri = ${?OPTAGENT_SNAPSHOT_S3_URI}
  endpoint = ""
  endpoint = ${?OPTAGENT_SNAPSHOT_ENDPOINT}
}
